name: Integration Tests (Real Project)

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at 06:00 UTC
    - cron: '0 6 * * 0'
  push:
    branches: [main, master]

jobs:
  integration-real:
    runs-on: ubuntu-latest
    # Only run when secrets are available (prevents failures on forks)
    if: ${{ github.repository_owner == 'Yarah' }}

    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run real-project integration tests
        run: npm run test:integration:real
        env:
          INTEGRATION_TEST_ENABLED: 'true'
          YARAH_CLIENT_SECRET: ${{ secrets.YARAH_API_KEY }}
          YARAH_API_BASE: ${{ secrets.YARAH_API_BASE_URL }}
          INTEGRATION_FUNCTION_SLUG: ${{ secrets.YARAH_FUNCTION_SLUG }}
          INTEGRATION_TABLE_NAME: ${{ secrets.YARAH_TABLE_NAME }}
          INTEGRATION_LOG_SOURCE: ${{ secrets.YARAH_LOG_SOURCE }}
